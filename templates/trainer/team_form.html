{% extends 'base.html' %}
{% block title %}Neues Team{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 560px">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4 fw-bold mb-4"><i class="bi bi-people text-danger"></i> Neues Team</h1>
            <form method="post" novalidate>{% csrf_token %}
                {% include 'includes/form_fields.html' %}
                <button class="btn btn-danger">Team erstellen</button>
                <a href="{% url 'trainer:dashboard' %}" class="btn btn-link">Abbrechen</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
