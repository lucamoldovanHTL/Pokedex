{# Erwartet: p (Pokemon), optional is_fav #}
<div class="card pokemon-card h-100 border-0 shadow-sm" style="--type-color: {{ p.types.0.color }}">
    <a href="{{ p.get_absolute_url }}" class="stretched-link" aria-label="{{ p.display_name }}"></a>
    <div class="pokemon-card-img">
        <img src="{{ p.artwork }}" alt="{{ p.display_name }}" loading="lazy" onerror="this.src='{{ p.sprite }}'">
        {% if is_fav %}<i class="bi bi-heart-fill fav-mark" title="Favorit"></i>{% endif %}
    </div>
    <div class="card-body text-center p-2">
        <div class="text-muted small fw-semibold">{{ p.dex_number }}</div>
        <div class="fw-bold text-truncate">{{ p.display_name }}</div>
        <div class="d-flex justify-content-center gap-1 mt-1 position-relative" style="z-index:2">
            {% for type in p.types %}{% include 'includes/type_badge.html' with small=True %}{% endfor %}
        </div>
        {% if show_total %}<div class="small text-muted mt-1">Gesamt: <strong>{{ p.total }}</strong></div>{% endif %}
    </div>
</div>
